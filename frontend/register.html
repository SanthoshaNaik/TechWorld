<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech-World | Register</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <!-- Dynamic Navigation Bar Container -->
  <div id="navbar-container"></div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Create Account</h2>
        <p class="text-muted">Sign up to read and post gadget reviews</p>
      </div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <div class="form-input-wrapper">
            <i class="fas fa-user"></i>
            <input type="text" id="username" required placeholder="Choose a username">
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="form-input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" required placeholder="Enter your email">
          </div>
        </div>

        <div class="form-group">
          <label for="role">Register As</label>
          <div class="form-input-wrapper">
            <i class="fas fa-users-cog"></i>
            <select id="role" required>
              <option value="user">User (Reader Only)</option>
              <option value="publisher">Publisher (Write/Manage Posts)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="form-input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" required placeholder="Choose a password (min 6 chars)">
            <button type="button" class="btn-toggle-password" id="toggle-password" aria-label="Toggle Password Visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <div class="form-input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="confirm-password" required placeholder="Confirm your password">
            <button type="button" class="btn-toggle-password" id="toggle-confirm-password" aria-label="Toggle Password Visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="width: 100%; margin-top: 10px;">
          Sign Up <i class="fas fa-user-plus"></i>
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Log In Here</a></p>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer Container -->
  <div id="footer-container"></div>

  <!-- JavaScript Scripts -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
