<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech-World | Login</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <!-- Dynamic Navigation Bar Container -->
  <div id="navbar-container"></div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p class="text-muted">Login to explore tech gadget articles</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="form-input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" required placeholder="Enter your email">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="form-input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" required placeholder="Enter your password">
            <button type="button" class="btn-toggle-password" id="toggle-password" aria-label="Toggle Password Visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="width: 100%; margin-top: 10px;">
          Log In <i class="fas fa-sign-in-alt"></i>
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Sign Up Now</a></p>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer Container -->
  <div id="footer-container"></div>

  <!-- JavaScript Scripts -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
